name: edtech_platform
description: "Production-ready institution-centric educational mobile application for [CLIENT NAME]."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Navigation
  go_router: ^14.1.4

  # Firebase Core & Services
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.1
  firebase_crashlytics: ^3.5.4
  firebase_analytics: ^10.10.4
  firebase_remote_config: ^4.4.4
  cloud_functions: ^4.7.4

  # Third-Party Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Media & Video Player (YouTube Unlisted)
  youtube_player_iframe: ^5.1.2

  # Payments (Android & iOS)
  razorpay_flutter: ^1.3.7
  in_app_purchase: ^3.2.0

  # Networking & Connectivity
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # CSV Import Processing
  csv: ^6.0.0
  file_picker: ^8.0.3

  # Environment & Utilities
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  uuid: ^4.4.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
